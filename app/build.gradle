plugins { id 'com.android.application' }
android {
    namespace 'org.kravchuk.redmibuds'
    compileSdk 34
    defaultConfig { applicationId 'org.kravchuk.redmibuds'; minSdk 31; targetSdk 34; versionCode 11; versionName '0.11' }
    signingConfigs {
        // Same key as v1–v4 (the box's default debug key), kept in the project so updates install over each other.
        debug { storeFile file('../../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'androidx.core:core:1.12.0' }
